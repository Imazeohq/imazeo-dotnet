# Publishes Imazeo to NuGet.org via Trusted Publishing (OIDC).
#
# nuget.org → Trusted Publishing:
#   Repository owner: Imazeohq
#   Repository:       imazeo-dotnet
#   Workflow file:    publish.yml
#
# GitHub repo secret (optional): NUGET_USER = nuget.org profile username

name: Publish NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        run: python3 scripts/check-release.py
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/Imazeo/Imazeo.csproj -c Release -o artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/Imazeo.*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
